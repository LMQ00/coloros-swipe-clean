name: Build APK

on:
  push:
    branches: [main]
    # 纯文档改动不产出任何 APK 差异，不触发编译。
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 签名密钥不入库，构建时从 Secrets 解码到临时文件。
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE_B64 not set; falling back to debug signing"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          echo "KEYSTORE_PATH=$PWD/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Probe SDK (temporary)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/sdk}}"
          JAR="$SDK/platforms/android-36/android.jar"
          echo "=== BaseBundle full ==="
          javap -cp "$JAR" android.os.BaseBundle
          echo "=== Bundle string members ==="
          javap -cp "$JAR" android.os.Bundle | grep -iE "string" || true
          echo "=== control: SharedPreferences.getStringSet ==="
          javap -cp "$JAR" android.content.SharedPreferences | grep -i stringset || true
          echo "=== Process ==="
          javap -cp "$JAR" android.os.Process | grep -iE "myuid|userhandle" || true
          echo "=== UserManager ==="
          javap -cp "$JAR" android.os.UserManager | grep -iE "profile" || true
          echo "=== LauncherApps ==="
          javap -cp "$JAR" android.content.pm.LauncherApps || true
          echo "=== Context.getUser ==="
          javap -cp "$JAR" android.content.Context | grep -i "user" || true
          echo "=== StringSet availability per platform ==="
          for P in 34 35 36 36.1; do
            printf "android-%s: " "$P"
            javap -cp "$SDK/platforms/android-$P/android.jar" android.os.Bundle 2>/dev/null | grep -ci stringset
          done

      - name: Assemble release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: swipe-clean-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error